name: Battery Control

# Regression CI for the long-running huawei-battery-control integration branch on
# this fork. Mirrors upstream's Default workflow job-for-job but cannot call it via
# workflow_call because its jobs pin depot-ubuntu-* runners that are unavailable
# here, so every Depot runner label below is replaced with the free ubuntu-latest
# standard runner. Adds a focused -race job for the battery regulator/live-meter
# concurrency work and regression-gated branch image publication to GHCR.

on:
  push:
    branches:
      - huawei-battery-control
  pull_request:
    branches:
      - huawei-battery-control
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to validate, build, and publish
        required: true
        default: huawei-battery-control
        type: string

permissions:
  contents: read

env:
  TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.sha }}

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref }}
  cancel-in-progress: true

jobs:
  clean:
    name: Clean
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # avoid cache thrashing
        id: go

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-clean-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-clean-
            ${{ runner.os }}-go-

      - name: Install tools
        run: make install

      - name: Assets
        run: make assets

      - name: Docs
        run: make docs

      - name: Porcelain
        run: make porcelain

  build:
    name: Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-build-
            ${{ runner.os }}-go-

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - run: mkdir dist && touch dist/empty

      - name: Build
        run: make build

  test:
    name: Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-
            ${{ runner.os }}-go-

      - name: Test
        run: mkdir dist && touch dist/empty && make test

  lint:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false # avoid cache thrashing
        id: go

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-lint-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-lint-
            ${{ runner.os }}-go-

      - run: mkdir dist && touch dist/empty

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: latest
          args: --timeout 5m

      - name: License
        run: make license

  ui:
    name: UI
    permissions:
      contents: read
      actions: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Install
        run: make install-ui

      - name: Lint
        run: make lint-ui

      - name: Test
        run: make test-ui

      - name: License
        run: make license-ui

      - name: Build UI
        run: make ui

      - name: Cache dist
        # avoid cache thrashing by nightly
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        uses: actions/cache/save@v6
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.sha }}-dist

      - name: Porcelain
        run: |
          test -z "$(git status --porcelain)" || (git status; git diff; false)

  integration:
    name: Integration
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-integration-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-integration-
            ${{ runner.os }}-go-

      - uses: actions/setup-node@v6
        with:
          node-version: "26"
          cache: "npm"

      - name: Build UI
        run: make install-ui ui

      - name: Build Go
        run: make build

      - name: Get Playwright version
        id: playwright-version
        run: echo "PLAYWRIGHT_VERSION=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> $GITHUB_ENV

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ env.PLAYWRIGHT_VERSION }}

      - name: Install Playwright (browsers + deps)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
        timeout-minutes: 5

      - name: Run tests
        run: npx playwright test
        timeout-minutes: 20
        env:
          TZ: Europe/Berlin

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright Raw Test Results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 2

  battery-race:
    name: Battery Race
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          persist-credentials: false

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
        id: go

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-race-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-race-
            ${{ runner.os }}-go-

      - run: mkdir dist && touch dist/empty

      - name: Battery regulator / live-meter race tests
        # scoped to the two packages that own the battery regulator and live-meter
        # concurrency work; verify with `go test -list` before widening the regex
        run: go test -race -count=1 -run '^(TestBatteryPower|TestLiveMeter)' -v ./core ./meter

  docker-build:
    name: Docker Build
    needs: [clean, build, test, lint, ui, integration, battery-race]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TARGET_REF }}
          fetch-depth: 0 # full history + tags so `make build` can compute a real VERSION
          persist-credentials: false

      - name: Derive image metadata
        id: metadata
        env:
          SOURCE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || github.ref_name }}
        run: |
          tag="$(printf '%s' "$SOURCE_REF" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')"
          tag="${tag:0:100}"
          tag="$(printf '%s' "$tag" | sed -E 's/[.-]+$//')"
          if [ -z "$tag" ]; then
            echo "Branch name does not produce a valid Docker tag" >&2
            exit 1
          fi

          sha="$(git rev-parse HEAD)"
          short_sha="$(git rev-parse --short=12 HEAD)"
          {
            echo "tag=$tag"
            echo "sha=$sha"
            echo "short_sha=$short_sha"
          } >> "$GITHUB_OUTPUT"

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image locally
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: evcc-battery-control-ci:local
          build-args: |
            RELEASE=0
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            org.opencontainers.image.ref.name=${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=battery-control-docker
          cache-to: type=gha,mode=max,scope=battery-control-docker

      - name: Smoke test local image
        if: github.event_name == 'pull_request'
        run: docker run --rm evcc-battery-control-ci:local evcc --version

      - name: Build and publish image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          load: false
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.tag }}
            ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.tag }}-sha-${{ steps.metadata.outputs.short_sha }}
          build-args: |
            RELEASE=0
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.metadata.outputs.sha }}
            org.opencontainers.image.ref.name=${{ steps.metadata.outputs.tag }}
          cache-from: type=gha,scope=battery-control-docker
          cache-to: type=gha,mode=max,scope=battery-control-docker

      - name: Smoke test published image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ghcr.io/${{ github.repository }}:${{ steps.metadata.outputs.tag }}
        run: |
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" evcc --version
